<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Circuit 3D</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
  </script>
</head>
<body>
  <canvas id="game"></canvas>

  <!-- Interface pendant la course -->
  <div id="hud" class="hidden">
    <div class="panel tl">
      <div>Tour <b id="lap">1</b>/<span id="laps">3</span></div>
      <div>Temps <b id="time">0:00.000</b></div>
      <div>Meilleur tour <b id="best">--</b></div>
    </div>
    <div class="panel tr">
      <div id="speed">0</div>
      <div class="unit">km/h · rapport <span id="gear">1</span></div>
    </div>
    <canvas id="minimap" width="150" height="150"></canvas>
    <div id="countdown"></div>
    <div id="msg"></div>
    <button id="mute" title="Son">🔊</button>
  </div>

  <!-- Commandes tactiles (téléphone / tablette) -->
  <div id="touch" class="hidden">
    <div class="tgroup left">
      <button data-k="left">◀</button>
      <button data-k="right">▶</button>
    </div>
    <div class="tgroup right">
      <button data-k="hand" class="small">DRIFT</button>
      <button data-k="brake">FREIN</button>
      <button data-k="gas" class="gas">GAZ</button>
    </div>
  </div>

  <!-- Menu -->
  <div id="menu" class="overlay">
    <div class="card">
      <h1>CIRCUIT 3D</h1>
      <p class="sub">3 tours chronométrés. Le meilleur temps total entre au classement.</p>
      <button id="play" class="big">JOUER</button>
      <p class="help">Clavier : flèches ou ZQSD · Espace = frein à main · R = replacer la voiture</p>
      <h2>Classement <small id="lbmode"></small></h2>
      <ol id="lb-menu" class="lb"></ol>
    </div>
  </div>

  <!-- Fin de course -->
  <div id="end" class="overlay hidden">
    <div class="card">
      <h1>ARRIVÉE</h1>
      <div class="result">Temps total <b id="total"></b></div>
      <div class="result">Meilleur tour <b id="bestlap"></b></div>
      <form id="save">
        <input id="name" maxlength="16" placeholder="Ton pseudo" autocomplete="off" required>
        <button type="submit">Enregistrer</button>
      </form>
      <ol id="lb-end" class="lb"></ol>
      <button id="again" class="big">REJOUER</button>
    </div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
